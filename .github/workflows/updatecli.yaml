name: updatecli
on:
  # Allow to be run manually
  workflow_dispatch:
  schedule:
    # Run once per week (to avoid alert fatigue)
    - cron: '0 2 * * 1' # Every Monday at 2am UTC
  push:

permissions:
  contents: read

jobs:
  # Pull request and scheduled diffs run with read-only access.
  updatecli-diff:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jenkins-infra'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Run Updatecli in Dry Run mode
        run: updatecli pipeline diff --config ./updatecli/updatecli.d --values ./updatecli/values.github-action.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only apply changes from the trusted default branch, with the write permissions it needs.
  updatecli-apply:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jenkins-infra' && github.ref == 'refs/heads/master'
    needs: updatecli-diff
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Run Updatecli in Apply mode
        run: updatecli pipeline apply --config ./updatecli/updatecli.d --values ./updatecli/values.github-action.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
