<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" width="1040" height="310" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI agent and Jenkins feedback loop</title>
  <desc id="desc">An AI agent proposes a change, Jenkins runs the pipeline in an isolated worker and produces a build result with logs. A failed build sends the logs back to the agent for another attempt. A passing build goes to human review and then to release.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#335061"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
  </defs>

  <rect width="1040" height="310" fill="#ffffff"/>

  <!-- AI agent -->
  <rect x="20" y="90" width="170" height="90" rx="12" fill="#efe9fb" stroke="#6c4ab6" stroke-width="2"/>
  <text x="105" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#3d2a6b">AI agent</text>
  <text x="105" y="152" text-anchor="middle" font-size="14" fill="#3d2a6b">proposes a change</text>

  <!-- Jenkins -->
  <rect x="240" y="80" width="220" height="110" rx="12" fill="#e6eef3" stroke="#335061" stroke-width="3"/>
  <text x="350" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#335061">Jenkins pipeline</text>
  <text x="350" y="136" text-anchor="middle" font-size="14" fill="#335061">isolated worker</text>
  <text x="350" y="158" text-anchor="middle" font-size="14" fill="#335061">build · style · tests</text>
  <text x="350" y="178" text-anchor="middle" font-size="14" fill="#335061">security checks</text>

  <!-- Evidence -->
  <rect x="510" y="90" width="170" height="90" rx="12" fill="#fdf5e6" stroke="#c98a1b" stroke-width="2"/>
  <text x="595" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5210">Evidence</text>
  <text x="595" y="152" text-anchor="middle" font-size="14" fill="#7a5210">result + logs</text>

  <!-- Human review -->
  <rect x="740" y="90" width="140" height="90" rx="12" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="810" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e5c3a">Human</text>
  <text x="810" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e5c3a">review</text>

  <!-- Release -->
  <rect x="920" y="90" width="100" height="90" rx="12" fill="#2e8b57" stroke="#1e5c3a" stroke-width="2"/>
  <text x="970" y="141" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Release</text>

  <!-- Forward arrows -->
  <line x1="190" y1="135" x2="236" y2="135" stroke="#335061" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="215" y="120" text-anchor="middle" font-size="12" fill="#335061">PR</text>

  <line x1="460" y1="135" x2="506" y2="135" stroke="#335061" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="680" y1="135" x2="736" y2="135" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="708" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e8b57">green</text>

  <line x1="880" y1="135" x2="916" y2="135" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Retry loop -->
  <path d="M595,180 L595,250 L105,250 L105,184" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <text x="350" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">red: logs go back to the agent, which diagnoses and retries</text>

  <!-- Heading -->
  <text x="520" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">Agents propose, Jenkins verifies, humans decide</text>
</svg>
